name: Release checks
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 8 * * 1'
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-not-a-secret
      THECHAIR_PUBLIC_URL: https://the-chair-peach.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm --prefix mcp ci
      - run: npm run typecheck
      - run: npm test
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npm audit --audit-level=moderate
      - run: npm --prefix web audit --audit-level=moderate
      - run: npm --prefix mcp audit --audit-level=moderate
